<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entrega | La Tapatía Express</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#93000b">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="../../css/site.css">
<script defer src="../../src/config/site.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body class="bg-crema-bg text-on-surface font-body-md antialiased min-h-screen flex flex-col">

<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl shadow-sm">
  <div class="h-16 px-gutter flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="font-headline-sm text-headline-sm text-primary">La Tapatía</span>
      <span class="flex items-center gap-1 px-2 py-0.5 rounded-full bg-tertiary-container/10 text-tertiary font-label-sm text-[11px]">
        <span class="w-1.5 h-1.5 rounded-full bg-whatsapp-green animate-pulse"></span>Reparto
      </span>
    </div>
  </div>
</header>

<main class="flex-1 w-full pt-20 pb-8 px-gutter max-w-md mx-auto w-full">
  <div id="loading-state" class="flex flex-col gap-3">
    <div class="skeleton rounded-xl h-40"></div>
    <div class="skeleton rounded-xl h-24"></div>
  </div>

  <div id="expired-state" class="hidden bg-surface-container-lowest rounded-2xl p-6 text-center shadow-sm flex-col gap-2">
    <svg class="w-10 h-10 mx-auto text-tertiary" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-check"/></svg>
    <p class="font-headline-sm text-headline-sm text-on-surface">Este link ya no está disponible</p>
    <p class="font-body-sm text-body-sm text-on-surface-variant">La entrega ya fue completada, o el link venció.</p>
  </div>

  <div id="order-card" class="hidden flex-col gap-3">
    <div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="px-2.5 py-1 rounded-md bg-primary text-on-primary font-headline-sm text-headline-sm" id="order-folio"></span>
        <span class="font-price-md text-price-md text-primary font-bold" id="order-total"></span>
      </div>
      <div>
        <p class="font-label-md text-label-md font-bold" id="order-customer"></p>
        <p class="font-body-sm text-body-sm text-on-surface-variant" id="order-pickup"></p>
        <p class="font-body-sm text-body-sm text-on-surface-variant" id="order-address"></p>
      </div>
      <p id="order-notes" class="hidden font-body-sm text-body-sm bg-mustard-light/70 p-2 rounded-lg"></p>
      <div id="order-items" class="bg-crema-surface p-2.5 rounded-lg flex flex-col gap-1"></div>
      <div class="flex items-center gap-2">
        <a id="wa-customer" href="#" target="_blank" rel="noopener" class="flex-1 min-h-[44px] rounded-lg bg-whatsapp-green text-on-primary flex items-center justify-center gap-2 font-label-md text-label-md">
          <svg class="w-4 h-4" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-whatsapp"/></svg>WhatsApp
        </a>
        <a id="call-customer" href="#" class="flex-1 min-h-[44px] rounded-lg bg-surface-container flex items-center justify-center gap-2 font-label-md text-label-md">Llamar</a>
      </div>
    </div>

    <div id="charge-card" class="hidden bg-error-container text-on-error-container rounded-xl p-4 shadow-sm flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <span class="font-label-md text-label-md font-bold">Total a cobrar al cliente</span>
        <span class="font-headline-sm text-headline-sm font-bold" id="charge-total"></span>
      </div>
      <p id="charge-cash-note" class="hidden font-body-sm text-[12px]"></p>
    </div>

    <div id="commission-card" class="hidden bg-tertiary-container text-on-tertiary-container rounded-xl p-4 shadow-sm flex items-center justify-between">
      <span class="font-label-md text-label-md font-bold">Tu pago por esta entrega</span>
      <span class="font-headline-sm text-headline-sm font-bold" id="commission-value"></span>
    </div>

    <a id="nav-google" href="#" target="_blank" rel="noopener" class="min-h-[56px] rounded-xl bg-primary text-on-primary flex items-center justify-center gap-2 font-headline-sm text-headline-sm shadow-md">
      Navegar con Google Maps
    </a>
    <a id="nav-waze" href="#" target="_blank" rel="noopener" class="min-h-[44px] rounded-lg bg-surface-container-lowest flex items-center justify-center gap-2 font-label-md text-label-md shadow-sm">
      Abrir en Waze
    </a>

    <div id="route-map" class="hidden w-full h-48 rounded-xl overflow-hidden shadow-sm"></div>

    <button id="btn-start-route" class="hidden min-h-[52px] rounded-xl bg-secondary text-on-secondary font-headline-sm text-headline-sm shadow-md">
      Salir a Repartir
    </button>
    <div class="flex flex-col gap-2">
      <button id="btn-mark-delivered" class="hidden min-h-[52px] rounded-xl bg-whatsapp-green text-on-primary font-headline-sm text-headline-sm shadow-md">
        Marcar como Entregado
      </button>
      <button id="btn-incident" class="min-h-[44px] rounded-lg bg-surface-container text-error font-label-md text-label-md">
        Reportar Incidencia
      </button>
    </div>
  </div>
</main>

<div id="modal-confirm" class="hidden fixed inset-0 z-50 bg-inverse-surface/60 items-center justify-center p-4">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-sm p-5 flex flex-col gap-4">
    <h3 class="font-headline-sm text-headline-sm">Confirmar entrega</h3>
    <p class="font-body-sm text-body-sm text-on-surface-variant">¿Ya entregaste el pedido y recibiste el pago?</p>
    <div class="flex gap-2">
      <button id="modal-confirm-cancel" class="flex-1 py-3 rounded-lg bg-surface-container font-label-md text-label-md">Cancelar</button>
      <button id="modal-confirm-ok" class="flex-1 py-3 rounded-lg bg-whatsapp-green text-on-primary font-headline-sm text-headline-sm">Sí, finalizar</button>
    </div>
  </div>
</div>

<div id="modal-incident" class="hidden fixed inset-0 z-50 bg-inverse-surface/60 items-center justify-center p-4">
  <div class="bg-surface-container-lowest rounded-2xl w-full max-w-sm p-5 flex flex-col gap-3">
    <h3 class="font-headline-sm text-headline-sm">Reportar incidencia</h3>
    <button class="incident-reason text-left p-3 bg-surface-container-low rounded-lg" data-reason="El cliente no contesta timbre ni teléfono">El cliente no contesta timbre ni teléfono</button>
    <button class="incident-reason text-left p-3 bg-surface-container-low rounded-lg" data-reason="Dirección no encontrada / número inexistente">Dirección no encontrada / número inexistente</button>
    <button class="incident-reason text-left p-3 bg-surface-container-low rounded-lg" data-reason="Derrame de empaque o producto dañado">Derrame de empaque o producto dañado</button>
    <button id="modal-incident-cancel" class="py-2 font-label-md text-label-md text-on-surface-variant">Cancelar</button>
  </div>
</div>

<script src="../../src/js/api.js"></script>
<script src="../../src/js/catalog.js"></script>
<script src="../../src/js/toast.js"></script>
<script src="../../src/js/reparto-link.js"></script>
</body>
</html>
