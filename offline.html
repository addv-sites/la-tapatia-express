<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sin conexión — La Tapatía Ahogadas</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body class="bg-crema-bg text-on-surface font-body-md min-h-screen flex items-center justify-center px-6">
  <div class="max-w-sm text-center flex flex-col items-center gap-4">
    <div class="w-16 h-16 rounded-full bg-mustard-light flex items-center justify-center text-secondary text-2xl" aria-hidden="true">📶</div>
    <h1 class="font-headline-md text-headline-md text-on-surface">Sin conexión</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">
      No hay internet en este momento. El menú que ya viste sigue disponible,
      pero los precios podrían no estar actualizados. Intenta de nuevo cuando
      recuperes señal.
    </p>
    <button onclick="location.reload()" class="min-h-[48px] px-5 rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm active:scale-[0.98] transition-transform">
      Reintentar
    </button>
  </div>
</body>
</html>
