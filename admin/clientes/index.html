<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes — La Tapatía Express</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../../css/site.css">
<script defer src="../../src/config/site.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-crema-bg text-on-surface font-body-md antialiased min-h-screen">

<header class="fixed top-0 left-0 right-0 h-16 bg-surface/90 backdrop-blur-xl shadow-sm z-50 flex items-center justify-between gap-2 px-3 sm:px-6">
  <div class="flex items-center gap-2 min-w-0">
    <a href="../" class="flex items-center gap-1 shrink-0 font-label-md text-label-md text-on-surface-variant hover:text-primary">
      <svg class="w-4 h-4 shrink-0" aria-hidden="true" style="transform:rotate(180deg)"><use href="../../assets/icons/sprite.svg#icon-arrow-right"/></svg>
      <span class="hidden sm:inline">Panel</span>
    </a>
    <span class="text-outline-variant shrink-0 hidden sm:inline">/</span>
    <span class="font-headline-sm text-headline-sm text-primary truncate">Clientes</span>
  </div>
  <button id="btn-signout-header" class="font-label-md text-label-md text-on-surface-variant hover:text-error whitespace-nowrap">Salir</button>
</header>

<main class="pt-16 min-h-screen">
  <div id="auth-gate" class="min-h-[70vh] flex items-center justify-center"></div>

  <div id="admin-content" class="hidden max-w-5xl mx-auto px-4 sm:px-6 py-6">
    <div id="promo-banner" class="rounded-2xl p-4 mb-4 flex flex-col gap-3 shadow-md transition-colors">
      <div class="flex items-center gap-3">
        <svg id="promo-banner-icon" class="w-8 h-8 shrink-0" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-check"/></svg>
        <div class="flex-1 min-w-0">
          <p id="promo-banner-title" class="font-headline-sm text-headline-sm font-bold"></p>
          <p id="promo-banner-sub" class="font-body-sm text-[12px]"></p>
        </div>
        <label class="relative inline-flex items-center cursor-pointer shrink-0">
          <input id="promo-enabled" type="checkbox" class="sr-only peer">
          <div class="w-11 h-6 bg-white/30 rounded-full peer relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"></div>
        </label>
      </div>
      <div class="flex items-center gap-2 rounded-xl p-2" id="promo-stepper-wrap">
        <label class="font-body-sm text-body-sm">Cada</label>
        <button id="promo-threshold-minus" type="button" class="w-8 h-8 rounded-lg font-bold">−</button>
        <input id="promo-threshold" type="number" min="1" class="w-14 h-8 px-2 rounded-lg text-center font-bold" readonly>
        <button id="promo-threshold-plus" type="button" class="w-8 h-8 rounded-lg font-bold">+</button>
        <label class="font-body-sm text-body-sm">pedidos entregados seguidos, el siguiente trae envío gratis.</label>
        <button id="promo-save" type="button" class="ml-auto h-9 px-3 rounded-lg font-label-sm text-label-sm font-bold">Guardar</button>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2 mb-4">
      <input id="client-search" type="text" placeholder="Buscar por nombre, teléfono o email…"
        class="flex-1 min-w-[200px] h-11 px-3.5 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30">

      <div class="relative">
        <button id="export-open" type="button" class="h-11 px-4 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-bold flex items-center gap-1.5">
          <svg class="w-4 h-4" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-save"/></svg>
          Exportar
        </button>
        <div id="export-menu" class="hidden absolute right-0 top-[calc(100%+6px)] w-72 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg p-2 z-20">
          <button type="button" class="export-preset w-full text-left px-3 py-2.5 rounded-lg hover:bg-surface-container-low" data-preset="all">
            <span class="block font-label-md text-label-md font-bold text-on-surface">Todo</span>
            <span class="block font-label-sm text-[11px] text-on-surface-variant">Todas las columnas, todos los clientes</span>
          </button>
          <button type="button" class="export-preset w-full text-left px-3 py-2.5 rounded-lg hover:bg-surface-container-low" data-preset="contact">
            <span class="block font-label-md text-label-md font-bold text-on-surface">Solo contacto</span>
            <span class="block font-label-sm text-[11px] text-on-surface-variant">Nombre, teléfono, email, dirección</span>
          </button>
          <button type="button" class="export-preset w-full text-left px-3 py-2.5 rounded-lg hover:bg-surface-container-low" data-preset="marketing">
            <span class="block font-label-md text-label-md font-bold text-on-surface">Solo opt-in marketing</span>
            <span class="block font-label-sm text-[11px] text-on-surface-variant">Clientes que aceptaron mensajes</span>
          </button>
          <div class="h-px bg-surface-container-high my-1.5 mx-1"></div>
          <button type="button" id="export-custom-trigger" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-surface-container-low">
            <span class="block font-label-md text-label-md font-bold text-on-surface">Personalizado…</span>
            <span class="block font-label-sm text-[11px] text-on-surface-variant">Elige columnas a mano</span>
          </button>
          <div id="export-custom-panel" class="hidden px-2 pt-1 pb-2">
            <div id="export-custom-cols" class="grid grid-cols-2 gap-1.5 mb-2"></div>
            <button type="button" id="export-custom-run" class="w-full h-10 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-bold">Exportar selección</button>
          </div>
        </div>
      </div>
    </div>

    <p id="client-count" class="font-label-sm text-label-sm text-on-surface-variant mb-3"></p>

    <div class="grid grid-cols-1 md:grid-cols-[280px_1fr] gap-4">
      <div id="client-list" class="bg-surface-container-lowest border border-outline-variant rounded-2xl overflow-hidden max-h-[70vh] overflow-y-auto"></div>
      <div id="client-detail" class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-5 flex items-center justify-center text-center font-body-sm text-body-sm text-on-surface-variant min-h-[220px]">
        Selecciona un cliente de la lista para ver su perfil completo.
      </div>
    </div>
  </div>
</main>

<script src="../../src/js/api.js"></script>
<script src="../../src/js/auth.js"></script>
<script src="../../src/js/auth-gate.js"></script>
<script src="../../src/js/catalog.js"></script>
<script src="../../src/js/toast.js"></script>
<script src="../../src/js/admin-clientes.js"></script>
</body>
</html>
