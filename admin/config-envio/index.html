<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuraciones — La Tapatía Express</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../../css/site.css">
<script defer src="../../src/config/site.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-crema-bg text-on-surface font-body-md antialiased min-h-screen">

<header class="fixed top-0 left-0 right-0 h-16 bg-surface/90 backdrop-blur-xl shadow-sm z-50 flex items-center justify-between px-6">
  <div class="flex items-center gap-3">
    <a href="../" class="flex items-center gap-1.5 font-label-md text-label-md text-on-surface-variant hover:text-primary">
      <svg class="w-4 h-4" aria-hidden="true" style="transform:rotate(180deg)"><use href="../../assets/icons/sprite.svg#icon-arrow-right"/></svg>
      Panel
    </a>
    <span class="text-outline-variant">/</span>
    <span class="font-headline-sm text-headline-sm text-primary">Configuraciones</span>
  </div>
  <button id="btn-signout-header" class="font-label-md text-label-md text-on-surface-variant hover:text-error">Cerrar sesión</button>
</header>

<main class="pt-16 min-h-screen">
  <div id="auth-gate" class="min-h-[70vh] flex items-center justify-center"></div>

  <div id="admin-content" class="hidden max-w-lg mx-auto px-6 pt-8 pb-28 flex flex-col gap-4">
    <p class="font-body-sm text-body-sm text-on-surface-variant">
      Esta pantalla no está en el diseño original — se agregó porque el pedido con entrega a domicilio necesita tarifa por zona configurable, decisión tomada durante el análisis del proyecto.
    </p>

    <div class="flex gap-2 p-1 bg-surface-container-low rounded-xl">
      <button id="tab-envio" type="button" class="flex-1 min-h-[40px] rounded-lg font-label-md text-label-md font-bold bg-primary-fixed text-on-primary-fixed">Envío</button>
      <button id="tab-horario" type="button" class="flex-1 min-h-[40px] rounded-lg font-label-md text-label-md font-bold text-on-surface-variant">Horario</button>
    </div>

    <div id="panel-envio" class="flex flex-col gap-4">
      <label class="flex items-center justify-between p-3 bg-surface-container-lowest rounded-xl shadow-sm">
        <span class="font-label-md text-label-md font-bold">Entrega a domicilio habilitada</span>
        <input id="cfg-delivery-enabled" type="checkbox" class="w-5 h-5">
      </label>

      <div class="flex items-center gap-2 px-1">
        <svg class="w-4 h-4 text-primary" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-location"/></svg>
        <h2 class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-bold">Zonas de envío</h2>
      </div>

      <div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col gap-3">
        <h3 class="font-headline-sm text-headline-sm">Zona 1</h3>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col gap-1 font-label-sm text-label-sm">Hasta (km)
            <input id="cfg-z1-km" type="number" step="0.1" class="h-10 px-3 rounded-lg bg-surface-container-low">
          </label>
          <label class="flex flex-col gap-1 font-label-sm text-label-sm">Costo (MXN)
            <input id="cfg-z1-cost" type="number" class="h-10 px-3 rounded-lg bg-surface-container-low">
          </label>
        </div>
      </div>

      <div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col gap-3">
        <h3 class="font-headline-sm text-headline-sm">Zona 2</h3>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col gap-1 font-label-sm text-label-sm">Hasta (km)
            <input id="cfg-z2-km" type="number" step="0.1" class="h-10 px-3 rounded-lg bg-surface-container-low">
          </label>
          <label class="flex flex-col gap-1 font-label-sm text-label-sm">Costo (MXN)
            <input id="cfg-z2-cost" type="number" class="h-10 px-3 rounded-lg bg-surface-container-low">
          </label>
        </div>
      </div>

      <div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col gap-3">
        <h3 class="font-headline-sm text-headline-sm">Zona 3</h3>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex flex-col gap-1 font-label-sm text-label-sm">Hasta (km)
            <input id="cfg-z3-km" type="number" step="0.1" class="h-10 px-3 rounded-lg bg-surface-container-low">
          </label>
          <label class="flex flex-col gap-1 font-label-sm text-label-sm">Costo (MXN)
            <input id="cfg-z3-cost" type="number" class="h-10 px-3 rounded-lg bg-surface-container-low">
          </label>
        </div>
      </div>

      <div class="flex items-center gap-2 px-1 mt-1">
        <svg class="w-4 h-4 text-secondary" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-whatsapp"/></svg>
        <h2 class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-bold">Comisión del repartidor</h2>
      </div>
      <label class="flex flex-col gap-1 font-label-sm text-label-sm bg-surface-container-lowest rounded-xl p-4 shadow-sm">
        Comisión fija por entrega (MXN)
        <input id="cfg-driver-commission" type="number" class="h-10 px-3 rounded-lg bg-surface-container-low">
      </label>
    </div>

    <div id="panel-horario" class="hidden flex-col gap-4">
      <div class="flex items-center gap-2 px-1">
        <svg class="w-4 h-4 text-tertiary" aria-hidden="true"><use href="../../assets/icons/sprite.svg#icon-fire"/></svg>
        <h2 class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-bold">Horario del negocio</h2>
      </div>
      <div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex flex-col">
        <div id="hours-rows" class="flex flex-col"></div>
      </div>
    </div>
  </div>

  <div id="save-bar" class="hidden fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest/95 backdrop-blur-xl border-t border-surface-container-high shadow-[0_-4px_20px_rgba(50,20,10,0.06)] p-4">
    <button id="save-config" class="max-w-lg mx-auto w-full block min-h-[48px] rounded-xl bg-primary text-on-primary font-headline-sm text-headline-sm shadow-md">
      Guardar configuración
    </button>
  </div>
</main>

<script src="../../src/js/api.js"></script>
<script src="../../src/js/auth.js"></script>
<script src="../../src/js/auth-gate.js"></script>
<script src="../../src/js/toast.js"></script>
<script src="../../src/js/admin-config-envio.js"></script>
</body>
</html>
