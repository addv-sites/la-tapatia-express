name: Build y desplegar a GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/20 9-19 * * 0,2-6' # cada 20 min en horario de operación aprox., cierra lunes (UTC del runner — ver nota de huso horario abajo)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Snapshot del catálogo (best-effort, no falla el build si Apps Script aún no está desplegado)
        run: node scripts/build-snapshot.mjs

      - run: npm run build:css

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
